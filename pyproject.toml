[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timecop"
version = "0.1.0"
description = "Terminal seatbelt: allow/warn/block shell commands before they run, judged by Jev (TypeSafe System One model)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
timecop = "timecop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["timecop*"]
